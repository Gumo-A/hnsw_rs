[workspace]
resolver = "2"
members = [
  "hnsw",
  "eval_glove",
  "vectors", 
  "graph",
  "points",
  "hnsw-engine",
]

[profile.release]
lto = true
codegen-units = 1
debug = true  # for valgrind analysis

[profile.release-profile]
inherits = "release"
debug = true

[build]
rustflags = ["-C", "target-cpu=native"]
