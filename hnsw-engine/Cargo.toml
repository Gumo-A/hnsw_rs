[package]
name = "hnsw-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
graph = {path = "../graph"}
vectors = {path = "../vectors"}
points = {path = "../points"}
indicatif = "0.17.8"
nohash-hasher = "0.2.0"
rand = "0.8.5"
regex = "1.10.3"
serde_json = "1.0.114"
serde = { version = "1.0.229", features = ["derive"] }
num = "0.4.3"
itertools = "0.14.0"
env_logger = "0.11.11"
log = "0.4.33"
repo_path = "1.4.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[build]
rustflags = ["-C", "target-cpu=native"]
